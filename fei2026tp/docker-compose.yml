version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fei_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./.data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  django:
    build:
      context: ./config/django-image
    container_name: fei_backend
    restart: always
    volumes:
      - ./backend:/app
      - ./config/django-image/entrypoint.sh:/app/entrypoint.sh:ro
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db